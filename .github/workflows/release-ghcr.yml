name: Build and publish Homebox MCP image

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine tag type
        id: tagtype
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

          if [[ "${VERSION}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-rc[0-9]+)?$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            RC_SUFFIX="${BASH_REMATCH[4]}"
            echo "major=${MAJOR}" >> "$GITHUB_OUTPUT"
            echo "major_minor=${MAJOR}.${MINOR}" >> "$GITHUB_OUTPUT"

            if [[ -n "${RC_SUFFIX}" ]]; then
              echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
              echo "major_rc=${MAJOR}${RC_SUFFIX}" >> "$GITHUB_OUTPUT"
              echo "major_minor_rc=${MAJOR}.${MINOR}${RC_SUFFIX}" >> "$GITHUB_OUTPUT"
              echo "docker_tag=prelatest" >> "$GITHUB_OUTPUT"
            else
              echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
              echo "major_rc=" >> "$GITHUB_OUTPUT"
              echo "major_minor_rc=" >> "$GITHUB_OUTPUT"
              echo "docker_tag=latest" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "major=" >> "$GITHUB_OUTPUT"
            echo "major_minor=" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "major_rc=" >> "$GITHUB_OUTPUT"
            echo "major_minor_rc=" >> "$GITHUB_OUTPUT"
            echo "docker_tag=prelatest" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.tagtype.outputs.version }}
            type=raw,value=${{ steps.tagtype.outputs.major }},enable=${{ steps.tagtype.outputs.major != '' && steps.tagtype.outputs.is_prerelease == 'false' }}
            type=raw,value=${{ steps.tagtype.outputs.major_minor }},enable=${{ steps.tagtype.outputs.major_minor != '' && steps.tagtype.outputs.is_prerelease == 'false' }}
            type=raw,value=${{ steps.tagtype.outputs.major_rc }},enable=${{ steps.tagtype.outputs.major_rc != '' && steps.tagtype.outputs.is_prerelease == 'true' }}
            type=raw,value=${{ steps.tagtype.outputs.major_minor_rc }},enable=${{ steps.tagtype.outputs.major_minor_rc != '' && steps.tagtype.outputs.is_prerelease == 'true' }}
            type=raw,value=${{ steps.tagtype.outputs.commit_sha }},enable=true
            type=raw,value=${{ steps.tagtype.outputs.docker_tag }},enable=true

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ steps.tagtype.outputs.is_prerelease == 'true' }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
