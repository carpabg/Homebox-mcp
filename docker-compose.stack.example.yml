services:
  homebox:
    image: ghcr.io/sysadminsmedia/homebox:0.27.1-rootless
    container_name: homebox
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Madrid}
      HBOX_MODE: production
      HBOX_LOG_LEVEL: info
      HBOX_LOG_FORMAT: text
      HBOX_WEB_MAX_UPLOAD_SIZE: 10
      HBOX_OPTIONS_ALLOW_REGISTRATION: ${HBOX_OPTIONS_ALLOW_REGISTRATION:-false}
    volumes:
      - homebox-data:/data
    ports:
      - "3100:7745"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  homebox-mcp:
    image: ghcr.io/carpabg/homebox-mcp:latest
    container_name: homebox-mcp
    restart: unless-stopped
    depends_on:
      - homebox
    environment:
      PORT: 3000
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN}
      HOMEBOX_API_TOKEN: ${HOMEBOX_API_TOKEN}
      HOMEBOX_BASE_URL: http://homebox:7745
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      - "3000:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  homebox-data:
